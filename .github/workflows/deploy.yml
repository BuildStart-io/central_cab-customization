name: Deploy Central Cab Edge Functions

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Edge Functions directly to Supabase volume
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "supabase/functions/**"
          target: "${{ secrets.SUPABASE_FUNCTIONS_PATH || '/root/supabase/supabase/docker/volumes/functions' }}"
          strip_components: 2

      - name: Restart Edge Functions Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            if docker ps --format '{{.Names}}' | grep -q "^supabase-edge-functions$"; then
              echo "Restarting supabase-edge-functions container..."
              docker restart supabase-edge-functions
            fi
